[package]
name = "ztrim"
version = "0.1.1"
edition = "2024"
build = "build.rs"

[[bin]]
name = "ztrim"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
rfd = "0.15"
rodio = "0.23.0"
openh264 = "0.9.9"
mp4 = "0.14.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
strip = true
